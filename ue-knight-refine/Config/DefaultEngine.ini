; Keep everything this project derives inside the project folder, so the team's shared
; caches under %LOCALAPPDATA%\UnrealEngine are never written. Launch with -DDC=KnightIsolated.

[DerivedDataCacheGraphs]
KnightIsolated=(EnginePak=InstalledEnginePak, EnterprisePak, Local=KnightLocal)

[DerivedDataCacheStores]
KnightLocal=(Type=FileSystem, Path="%GAMEDIR%DerivedDataCache/Local", UnusedFileAge=34, PromptIfMissing=false, DeleteUnused=false)

